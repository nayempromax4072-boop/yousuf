name: Build Yusuf Electronics Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Prepare and validate google-services.json
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 -d > app/google-services.json
          fi

          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json is missing! Add GOOGLE_SERVICES_JSON secret in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          python3 - <<'PY'
          import json
          with open("app/google-services.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          assert "project_info" in data and "client" in data, "Invalid google-services.json structure"
          print("Validated google-services.json for project:", data["project_info"].get("project_id"))
          PY

      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Decode optional release keystore from secret
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > my-upload-key.jks

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --no-configuration-cache --no-build-cache

      - name: Verify Firebase resources inside build
        run: |
          VALUES_XML="app/build/generated/res/processDebugGoogleServices/values/values.xml"
          if [ ! -f "$VALUES_XML" ] || ! grep -q "google_app_id" "$VALUES_XML"; then
            echo "::error::Firebase resources were not compiled into the APK!"
            exit 1
          fi
          echo "Verified google_app_id and Firebase config are bundled in the APK."

      - name: Build Signed Release APK (optional)
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --no-configuration-cache --no-build-cache

      - name: Prepare APK for download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "yusuf-electronics-b${{ github.run_number }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yusuf-electronics-apk-b${{ github.run_number }}
          path: yusuf-electronics-b${{ github.run_number }}.apk

      - name: Upload Signed Release APK Artifact (optional)
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: yusuf-electronics-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_FILE="yusuf-electronics-b${{ github.run_number }}.apk"
          if gh release view latest >/dev/null 2>&1; then
            for old_asset in $(gh release view latest --json assets --jq '.assets[].name'); do
              gh release delete-asset latest "$old_asset" --yes || true
            done
            gh release upload latest "$APK_FILE" --clobber
            gh release edit latest \
              --title "Yusuf Electronics APK (Build #${{ github.run_number }})" \
              --notes "Installable Android APK (Build #${{ github.run_number }}) with Firebase verified."
          else
            gh release create latest "$APK_FILE" \
              --title "Yusuf Electronics APK (Build #${{ github.run_number }})" \
              --notes "Installable Android APK (Build #${{ github.run_number }}) with Firebase verified."
          fi
